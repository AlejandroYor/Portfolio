<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alejandro Jolón — Technical Support Engineer & Data Engineer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    /*EDITMODE-BEGIN*/
    --tweaks-default-marker: 1;
    /*EDITMODE-END*/
    --bg: #14110D;            /* warm near-black, brown-tinted */
    --bg-2: #1C1813;          /* one step lighter, espresso */
    --bg-3: #221C16;          /* card surface */
    --fg: #F2EBDC;            /* warm cream */
    --fg-muted: #C9BFA8;      /* warm muted */
    --accent: oklch(0.62 0.10 150);   /* dark natural green */
    --accent-2: oklch(0.45 0.06 145); /* deeper forest */
    --brown: #8C6E4F;         /* warm walnut */
    --brown-deep: #5C4530;    /* dark coffee */
    --cream: #EFE4CC;         /* light warm bg */
    --cream-2: #E6D9BC;       /* slightly darker cream */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Kanit", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: var(--fg); }

  a { color: inherit; }
  html { scroll-behavior: smooth; }

  /* gentle global transitions on interactive elements */
  a, button, .cb, .skill-card, .project-card, .contact-grid > div, nav, nav a {
    transition-property: color, background, background-color, border-color, transform, box-shadow, opacity, filter;
    transition-duration: 380ms;
    transition-timing-function: cubic-bezier(.2,.7,.2,1);
  }

  /* link underline reveal */
  nav ul a { position: relative; }
  nav ul a::after {
    content: "";
    position: absolute; left: 14px; right: 14px; bottom: 6px;
    height: 1px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 420ms cubic-bezier(.2,.7,.2,1);
  }
  nav ul a:hover::after { transform: scaleX(1); }

  /* skill-card lift uses CSS now; JSX hover stays for color swap */
  .skill-card:hover { box-shadow: 0 24px 60px rgba(0,0,0,0.45); }

  /* project card subtle lift */
  .project-card { transition: box-shadow 480ms cubic-bezier(.2,.7,.2,1); }
  .project-card:hover { box-shadow: 0 40px 100px rgba(0,0,0,0.4); }

  /* ContactButton: never wrap, never shrink */
  .cb { white-space: nowrap !important; flex-shrink: 0 !important; }

  /* keyframes */
  @keyframes pulse {
    0% { transform: scale(0.7); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(6px, -4px); }
  }
  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    50% { filter: drop-shadow(0 0 14px color-mix(in oklch, var(--accent) 50%, transparent)); }
  }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 30px) scale(1.05); }
  }
  @keyframes blobFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, -20px) scale(0.95); }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes tickerL {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.33%); }
  }
  @keyframes tickerR {
    0% { transform: translateX(-33.33%); }
    100% { transform: translateX(0); }
  }

  /* ===== RESPONSIVE ===== */

  /* Tablet (≤1024px) */
  @media (max-width: 1024px) {
    .hero-heading { font-size: clamp(48px, 12vw, 120px) !important; }
    .hero-grid {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 48px !important;
    }
    .hero-portrait { max-width: 320px !important; margin: 0 auto !important; }
    .about-grid {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 48px !important;
    }
    .about-sticky { position: static !important; }
    .skills-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
    .skills-header {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 28px !important;
    }
    .projects-header {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 28px !important;
    }
    .project-card {
      grid-template-columns: minmax(0, 1fr) !important;
      padding: 40px 36px !important;
      gap: 28px !important;
      min-height: 0 !important;
    }
    .project-art-wrap {
      transform: scale(0.85);
      transform-origin: center;
    }
    .contact-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
  }

  /* Small tablet / large phone (≤720px) */
  @media (max-width: 720px) {
    nav ul { display: none !important; }
    nav { padding: 6px 6px 6px 16px !important; gap: 6px !important; }
    nav .nav-logo-text { font-size: 13px !important; }
    nav .cb { padding: 8px 12px 8px 14px !important; font-size: 12px !important; white-space: nowrap !important; flex-shrink: 0 !important; }

    section { padding-left: 20px !important; padding-right: 20px !important; }
    section#top { padding-top: 96px !important; padding-bottom: 60px !important; }
    section#about { padding: 96px 20px 84px !important; }
    section#skills { padding: 96px 20px 96px !important; }
    section#projects { padding: 96px 20px 0 !important; }
    section#contact { padding: 110px 20px 60px !important; }

    .hero-heading { font-size: clamp(44px, 16vw, 84px) !important; }
    .hero-tagline { font-size: 16px !important; margin-top: 24px !important; }
    .hero-portrait { max-width: 260px !important; }
    .hero-portrait .portrait-mini-left { left: -14px !important; bottom: 60px !important; padding: 8px 12px !important; font-size: 11.5px !important; }
    .hero-portrait .portrait-mini-right { right: -10px !important; top: 36px !important; padding: 8px 12px !important; font-size: 10px !important; }
    .hero-meta { margin-top: 50px !important; gap: 22px 32px !important; }
    .hero-meta > div { flex: 1 1 calc(50% - 16px) !important; min-width: 130px !important; }
    .status-chip { font-size: 11.5px !important; padding: 6px 12px 6px 10px !important; }

    .about-experience-row {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 6px !important;
      padding: 18px 0 !important;
    }
    .about-experience-row .exp-company {
      grid-column: 1 !important;
      order: 1;
    }
    .about-experience-row .exp-date { order: 0; }
    .about-experience-row .exp-body { order: 2; }

    .skills-grid {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 16px !important;
    }
    .skill-card { min-height: 0 !important; padding: 26px 22px 24px !important; }
    .skill-card h3 { font-size: 26px !important; margin-top: 28px !important; }

    .project-card {
      padding: 32px 24px !important;
      border-radius: 22px !important;
    }
    .project-card .project-title { font-size: clamp(30px, 8vw, 44px) !important; }
    .project-card .project-desc { font-size: 15.5px !important; }
    .project-watermark { right: 20px !important; top: 18px !important; font-size: 10px !important; }
    .project-art-wrap {
      transform: scale(0.7);
      margin: -40px auto -40px;
    }

    .contact-grid {
      grid-template-columns: minmax(0, 1fr) !important;
      margin-top: 60px !important;
    }
    .contact-grid > div { padding: 20px 18px !important; }
    .contact-buttons { gap: 10px !important; margin-top: 32px !important; }

    .cv-card { grid-template-columns: minmax(0,1fr) !important; }
    .cv-card > div { padding: 32px 24px !important; }
    section#cv { padding: 96px 20px !important; }
    .cv-header { flex-direction: column !important; align-items: flex-start !important; }

    .certs-grid { grid-template-columns: minmax(0,1fr) !important; }
    section#certs { padding: 80px 20px !important; }

    footer > div {
      flex-direction: column;
      gap: 12px !important;
      text-align: center;
      font-size: 10px !important;
    }
  }

  /* Small phone (≤420px) */
  @media (max-width: 420px) {
    section { padding-left: 16px !important; padding-right: 16px !important; }
    section#top { padding-top: 88px !important; }
    .hero-heading { font-size: clamp(40px, 17vw, 68px) !important; }
    .hero-tagline { font-size: 15px !important; }
    .hero-portrait { max-width: 220px !important; }
    .hero-portrait .portrait-mini-left,
    .hero-portrait .portrait-mini-right { display: none !important; }

    /* keep lang switch visible — make it slightly more compact */
    nav .lang-switch button { padding: 6px 9px !important; font-size: 10px !important; min-height: 28px; min-width: 36px; }

    .skill-card h3 { font-size: 24px !important; }

    .project-card { padding: 26px 20px !important; }
    .project-art-wrap { transform: scale(0.6); margin: -60px auto -60px; }

    .cb { padding: 12px 18px !important; font-size: 14px !important; }
  }

  /* Reduce motion for accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/i18n.jsx"></script>
  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/hero.jsx"></script>
  <script type="text/babel" src="components/about-skills.jsx"></script>
  <script type="text/babel" src="components/certifications.jsx"></script>
  <script type="text/babel" src="components/projects-contact.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "walnut",
      "showPortrait": true,
      "italicAccent": true
    }/*EDITMODE-END*/;

    const ACCENT_PRESETS = {
      forest: "oklch(0.62 0.10 150)",  /* warm dark green */
      moss:   "oklch(0.55 0.08 135)",
      olive:  "oklch(0.66 0.11 110)",
      walnut: "oklch(0.58 0.09 60)",
      cream:  "#EFE4CC",
    };

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const c = ACCENT_PRESETS[tweaks.accentColor] || ACCENT_PRESETS.forest;
        document.documentElement.style.setProperty("--accent", c);
      }, [tweaks.accentColor]);

      return (
        <LangProvider>
        <div>
          <Nav />
          <HeroSection heroVariant={tweaks.showPortrait ? "split" : "grid"} />
          <AboutSection />
          <SkillsSection />
          <ProjectsSection />
          <CertsSection />
          <ContactSection
            whatsappNumber="50254231394"
            whatsappMessage="Hi Alejandro! I came across your portfolio and I'd love to chat."
          />
          <Footer />

          <TweaksPanel title="Tweaks">
            <TweakSection title="Accent">
              <TweakRadio
                label="Color"
                value={tweaks.accentColor}
                onChange={(v) => setTweak("accentColor", v)}
                options={[
                  { value: "forest", label: "Forest" },
                  { value: "moss",   label: "Moss" },
                  { value: "olive",  label: "Olive" },
                  { value: "walnut", label: "Walnut" },
                  { value: "cream",  label: "Cream" },
                ]}
              />
            </TweakSection>
            <TweakSection title="Hero">
              <TweakToggle
                label="Show portrait card"
                value={tweaks.showPortrait}
                onChange={(v) => setTweak("showPortrait", v)}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
        </LangProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
